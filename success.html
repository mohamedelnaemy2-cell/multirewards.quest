<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlocked Successfully — GameVault</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  background: #060a17;
  color: #eef4ff;
  font-family: 'Inter', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  margin: 0;
}
.card {
  background: linear-gradient(180deg, #101a33, #0d1629);
  border: 1px solid #1e2c4f;
  border-radius: 20px;
  padding: 36px 24px;
  max-width: 460px;
  width: 100%;
  text-align: center;
  box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}
.success-icon { font-size: 3.5rem; margin-bottom: 12px; }
h2 { font-family: 'Orbitron', sans-serif; color: #22c55e; margin-bottom: 12px; letter-spacing: 1px; }
p { color: #8fa3c8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
.game-highlight { color: #38bdf8; font-weight: bold; }
.code-box {
  background: #081020;
  border: 1px dashed #38bdf8;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 24px;
}
.code-text {
  font-family: 'Orbitron', monospace;
  font-size: 1.25rem;
  font-weight: 800;
  color: #fbbf24;
  letter-spacing: 2px;
}
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  text-decoration: none;
  margin-bottom: 12px;
  font-size: 0.95rem;
  transition: transform 0.2s, filter 0.2s;
}
.btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
.btn-copy { background: #3b82f6; color: #fff; }
.btn-pdf { background: #22c55e; color: #fff; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="card" id="loadingBox">
  <p>Verifying secure session...</p>
</div>

<div class="card hidden" id="successBox">
  <div class="success-icon">🎉</div>
  <h2>UNLOCKED!</h2>
  <p>Verification successful! Here is your exclusive <span id="gameNameDisplay" class="game-highlight">Game</span> redeem code:</p>

  <div class="code-box">
    <span class="code-text" id="finalCode">GV-8472-K92M-Q41Z</span>
  </div>

  <button class="btn btn-copy" id="copyBtn" onclick="copyCode()">📋 COPY CODE</button>
  <a href="guide.pdf" download class="btn btn-pdf">⬇️ DOWNLOAD REWARD GUIDE (PDF)</a>
</div>

<div class="card hidden" id="unauthBox">
  <h2 style="color:#ef4444">Verification Required</h2>
  <p>No completed offer was detected for this session. Please return and complete the quick verification.</p>
  <a href="index.html" class="btn btn-copy">Back to Home</a>
</div>

<script>
const WORKER_URL = "https://cpa-postback-validator.youssefnassiri087.workers.dev";
const urlParams = new URLSearchParams(window.location.search);
const subid = urlParams.get("token") || localStorage.getItem("user_subid");
const gameName = urlParams.get("game") || "Reward";

function generateCode(game) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const part = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
  let prefix = "GV";
  if (game.includes("Free Fire")) prefix = "FF";
  else if (game.includes("Roblox")) prefix = "RBX";
  else if (game.includes("PUBG")) prefix = "PUBG";
  else if (game.includes("Fortnite")) prefix = "FRT";
  return `${prefix}-${part()}-${part()}-${part()}`;
}

async function checkAccess() {
  if(!subid) { showUnauth(); return; }
  try {
    const res = await fetch(`${WORKER_URL}/check-status?subid=${encodeURIComponent(subid)}`);
    const data = await res.json();
    if(data.completed) {
      document.getElementById('loadingBox').classList.add('hidden');
      document.getElementById('gameNameDisplay').innerText = gameName;
      document.getElementById('finalCode').innerText = generateCode(gameName);
      document.getElementById('successBox').classList.remove('hidden');
    } else {
      showUnauth();
    }
  } catch(e) {
    showUnauth();
  }
}

function showUnauth() {
  document.getElementById('loadingBox').classList.add('hidden');
  document.getElementById('unauthBox').classList.remove('hidden');
}

function copyCode() {
  const code = document.getElementById('finalCode').innerText;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.innerText = "COPIED!";
    setTimeout(() => btn.innerText = "📋 COPY CODE", 2000);
  });
}

checkAccess();
</script>
</body>
</html>
